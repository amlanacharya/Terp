# PostgreSQL configuration file for TravelERP Lite
# Optimized for desktop use with 4-5 concurrent users

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

# Connection Settings
listen_addresses = 'localhost'          # Listen on localhost only for now
port = 5432                             # Default port
max_connections = 10                    # Supports 4-5 concurrent users
superuser_reserved_connections = 3

# Authentication
authentication_timeout = 1min
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# RESOURCE USAGE (for desktop use)
#------------------------------------------------------------------------------

# Memory - Conservative settings for desktop application
shared_buffers = 128MB                  # Start with 128MB
effective_cache_size = 256MB            # 2x shared_buffers
work_mem = 16MB                         # Memory for sorting/hash operations
maintenance_work_mem = 64MB             # Memory for VACUUM, CREATE INDEX, etc.

# Query Tuning
random_page_cost = 1.1                  # Assume SSD storage
effective_io_concurrency = 200          # SSD optimized
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

wal_level = replica
min_wal_size = 80MB
max_wal_size = 1GB
wal_compression = on
wal_buffers = 16MB

#------------------------------------------------------------------------------
# CHECKPOINTING
#------------------------------------------------------------------------------

checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 1MB

#------------------------------------------------------------------------------
# ARCHIVING
#------------------------------------------------------------------------------

# Archiving disabled for local desktop use
archive_mode = off

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------

# Replication disabled (will be enabled in Phase 5 for multi-user)
max_wal_senders = 0
max_replication_slots = 0

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgres-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Log levels (reduce in production for performance)
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Locale and Formatting
datestyle = 'iso, mdy'
timezone = 'Asia/Kolkata'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# VERSION/PLATFORM COMPATIBILITY
#------------------------------------------------------------------------------

# No special compatibility settings needed

#------------------------------------------------------------------------------
# ERROR HANDLING
#------------------------------------------------------------------------------

# Terminate any session with more than 10,000 statements
statement_timeout = 30000                # 30 second query timeout
idle_in_transaction_session_timeout = 60000  # 1 minute idle timeout
lock_timeout = 10000                     # 10 second lock timeout

#------------------------------------------------------------------------------
# CONFIG FILE MODIFICATIONS
#------------------------------------------------------------------------------

# These settings are configured for TravelERP Lite desktop use
# For multi-user mode (Phase 5), listen_addresses will be changed to '*'
